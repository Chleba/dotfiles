# ==========================================
# 1. ZÁKLADNÍ NASTAVENÍ A ZKRATKY
# ==========================================

# Reload konfigurace (Prefix + r)
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Prefix nastaven na Ctrl+s
set -g prefix C-s

# Vim navigace mezi panely
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Podpora myši
setw -g mouse on

# True Color podpora (Alacritty / Kitty / Foot)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Rychlá odezva ESC
set -s escape-time 0

# Status bar nahoře
set -g status-position top

# ==========================================
# 2. PLUGINY (TPM)
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatická obnova relací
set -g @continuum-restore 'on'

# Dracula konfigurace
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-plugins "weather"
set -g @dracula-fixed-location "PRG"
set -g @dracula-show-fahrenheit false

# Dracula expects a icon name here, not a boolean
set -g @dracula-show-left-icon session

# Okraj neaktivního panelu
set -g pane-border-style fg='#6272a4'

# ==========================================
# 3. INICIALIZACE TPM
# ==========================================
run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# 4. DYNAMICKÉ RGB BARVENÍ (SPOŠTĚNÍ AŽ PO DRACULA PLUGINU)
# ==========================================

# Přepíše levý modul Draculy vlastní vypočítanou RGB barvou + Hostname
run-shell '
  # 1. Získání unikátního vstupu (Hostname + IP)
  host=$(hostname)
  ip=$(ip route get 1 2>/dev/null | awk "{print \$7; exit}")
  [ -z "$ip" ] && ip=$(hostname -I 2>/dev/null | awk "{print \$1}")
  combo="${host}${ip}"

  # 2. Generování HEX barvy z SHA256 (6 znaků)
  hex=$(echo -n "$combo" | sha256sum | head -c 6)

  # 3. Přepis levé části status baru na RGB blok s názvem stroje
  tmux set-option -g status-left "#[bg=#$hex,fg=#000000,bold] 🖥️  #h #[default] "

  # 4. Aplikace stejné RGB barvy na aktivní okraj okna
  tmux set-option -g pane-active-border-style "fg=#$hex"
'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
